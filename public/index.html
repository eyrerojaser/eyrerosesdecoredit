<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eyre Roses Decor Edit</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Eyre Roses">
<meta name="theme-color" content="#F8F5F4">
<meta name="description" content="Ambientes completos para inspirarte, con cada pieza a un clic. Por Eyre Roses Decor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Jost:wght@300..600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a boutique shop window. A framed hero scene, the pieces from that scene laid out beneath it, then collections and the full catalog. */
:root{
  --paper:#F8F5F4;--surface:#FFFFFF;--ink:#24191D;--muted:#76666B;--line:#E6DCDD;
  --rose:#8E2C46;--rose-ink:#FFFFFF;--gold:#A8874E;--tint:#F1E7E8;--ok:#2F6B4F;--warn:#9A5B12;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --radius:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151012;--surface:#1F181B;--ink:#F2EAEB;--muted:#A8979C;--line:#3A2E32;
  --rose:#E08AA1;--rose-ink:#24131A;--gold:#CDB07A;--tint:#2A2024;--ok:#7FC4A0;--warn:#E3A55A;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151012;--surface:#1F181B;--ink:#F2EAEB;--muted:#A8979C;--line:#3A2E32;
  --rose:#E08AA1;--rose-ink:#24131A;--gold:#CDB07A;--tint:#2A2024;--ok:#7FC4A0;--warn:#E3A55A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;font-weight:400}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.08}
.label{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.mark{text-decoration:none;display:flex;align-items:baseline;gap:.18em;font-family:var(--display);font-size:clamp(24px,3.4vw,32px);line-height:1;white-space:nowrap}
.mark i{font-style:italic;color:var(--rose);font-size:1.18em}
.mark span{font-weight:400}
.top-side{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);min-width:0}
.top-side a{text-decoration:none}
.top-side a:hover{color:var(--ink)}
.byline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.byline b{color:var(--ink);font-weight:500}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.lang button{border:0;background:transparent;cursor:pointer;font-size:12px;font-weight:500;letter-spacing:.08em;padding:4px 9px;border-radius:99px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.en-tag{display:inline-block;font-size:10px;letter-spacing:.12em;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.admin-link{border:1px solid var(--line);padding:6px 12px;border-radius:99px;color:var(--ink)!important;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gear{width:15px;height:15px;flex:none}

.subcats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;text-decoration:none;font-size:13px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Hero: the shop window */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(28px,5vw,56px)}
.window{margin:0;padding:10px;border:1px solid var(--gold);position:relative}
.window::after{content:"";position:absolute;inset:4px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);pointer-events:none}
.scene{aspect-ratio:4/3;width:100%;max-width:100%;overflow:hidden;background:var(--tint);position:relative;display:block}
.scene img{width:100%;height:100%;object-fit:cover;display:block}
/* Room photos keep their own shape so nothing in the scene is cut off */
.window .scene:has(img),.wide-window .scene:has(img){aspect-ratio:auto;background:transparent}
.window .scene:has(img) img,.wide-window .scene:has(img) img{height:auto;max-height:82vh;object-fit:contain}
.ccard .scene:has(img){aspect-ratio:auto;background:transparent}
.ccard .scene:has(img) img{height:auto;object-fit:contain}
.cgrid{align-items:start}
.hero-text{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero-text h1,.hero-text h2{font-size:clamp(36px,5.2vw,64px);font-weight:400}
.hero-text h1 em,.hero-text h2 em{color:var(--rose)}
/* Welcome: an arched portrait, like a florist's window */
.welcome{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(32px,6vw,72px) clamp(28px,4vw,48px)}
.portrait{margin:0;position:relative;max-width:320px;width:100%}
.portrait .arch{aspect-ratio:4/5;border-radius:999px 999px 6px 6px;overflow:hidden;background:var(--tint);border:1px solid var(--gold);padding:8px;max-width:100%}
.portrait .arch-in{width:100%;height:100%;border-radius:999px 999px 3px 3px;overflow:hidden;background:var(--tint);display:grid;place-items:center}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .mono{font-family:var(--display);font-style:italic;font-size:clamp(56px,9vw,96px);color:color-mix(in srgb,var(--rose) 70%,var(--muted));line-height:1}
.welcome-text{display:flex;flex-direction:column;gap:18px;min-width:0}
.welcome-text h1{font-size:clamp(40px,6.4vw,84px);font-weight:400;line-height:1}
.welcome-text h1 i{color:var(--rose)}
.welcome-text p{margin:0;font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:52ch;white-space:pre-line}
.welcome-text .sign{font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink)}
.welcome-actions{display:flex;gap:10px;flex-wrap:wrap}
.welcome + .hero{border-top:1px solid var(--line)}
@media (max-width:720px){
  .welcome{grid-template-columns:1fr;justify-items:center;text-align:center}
  .welcome-text{align-items:center}
  .portrait{max-width:220px}
  .welcome-actions{justify-content:center}
}
.hero-text p.desc{color:var(--muted);max-width:42ch;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:99px;font-size:14px;font-weight:500;letter-spacing:.02em;width:fit-content}
.btn:hover{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--tint);color:var(--ink);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:0}

/* Sections */
.sec{padding-block:clamp(28px,5vw,52px);border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-size:clamp(26px,3.4vw,38px);font-weight:400}
.sec-head h2 em{color:var(--rose)}
.sec-head .label{display:block;margin-bottom:6px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

/* Product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:26px 18px}
.pcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.pimg{aspect-ratio:1/1;background:#fff;border:1px solid var(--line);overflow:hidden;position:relative;max-width:100%}
.pimg img{width:100%;height:100%;object-fit:contain;padding:6%;display:block;transition:transform .5s ease}
.pcard:hover .pimg img{transform:scale(1.03)}
.pnum{position:absolute;top:10px;left:10px;font-family:var(--display);font-style:italic;font-size:15px;background:var(--surface);color:var(--ink);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.badge{position:absolute;top:10px;right:10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:99px}
.pbody{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pbody h3{font-family:var(--body);font-size:16px;font-weight:500;line-height:1.3}
.pnote{font-size:14px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.price{font-variant-numeric:tabular-nums;font-size:14px}
.buy{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:99px;background:var(--rose);color:var(--rose-ink);white-space:nowrap}
.buy:hover{filter:brightness(1.08)}
.buy svg,.btn svg{width:12px;height:12px;flex:none}
.btn{white-space:nowrap}

/* Placeholders */
.ph{width:100%;height:100%;display:grid;place-items:center;background:
  radial-gradient(120% 90% at 20% 10%,color-mix(in srgb,var(--rose) 14%,transparent),transparent 60%),var(--tint);color:var(--muted);text-align:center}
.ph b{font-family:var(--display);font-style:italic;font-weight:400;font-size:64px;color:color-mix(in srgb,var(--rose) 60%,var(--muted));line-height:1}
.ph small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.table-ph{position:absolute;inset:0;background:var(--t3)}
.table-ph .cloth{position:absolute;left:10%;right:10%;top:22%;bottom:22%;background:var(--t2);border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.table-ph .runner{position:absolute;left:10%;right:10%;top:44%;height:12%;background:var(--t1);opacity:.85}
.table-ph .plate{position:absolute;width:11%;aspect-ratio:1;border-radius:50%;background:#fbf8f4;box-shadow:inset 0 0 0 5px #efe7dc,0 4px 10px rgba(0,0,0,.15)}
.table-ph .candle{position:absolute;width:2.2%;aspect-ratio:1;border-radius:50%;background:#f4d48a;box-shadow:0 0 18px 6px rgba(244,212,138,.55)}
.table-ph .tag{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:99px;white-space:nowrap}

/* Collections grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.ccard{text-decoration:none;display:flex;flex-direction:column;gap:12px;min-width:0}
.ccard .scene{aspect-ratio:3/2;border:1px solid var(--line)}
.ccard h3{font-size:26px;font-weight:400}
.ccard:hover h3{color:var(--rose)}
.ccard p{margin:0;color:var(--muted);font-size:14px}

/* Collection page */
.crumb{font-size:13px;color:var(--muted);padding-top:22px}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--ink)}
.chead{display:grid;gap:14px;padding-block:18px 26px;max-width:760px}
.chead h1{font-size:clamp(36px,5.5vw,60px);font-weight:400}
.chead p{margin:0;color:var(--muted)}
.wide-window{margin:0 0 8px;padding:10px;border:1px solid var(--gold);position:relative}
.wide-window .scene{aspect-ratio:16/9}

.disclose{border-top:1px solid var(--line);padding-block:28px 40px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.disclose p{margin:0;max-width:70ch}
.ex-note{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;padding:2px 8px;border-radius:99px}

/* ---------- Admin ---------- */
.adm{padding-block:24px 60px}
.adm-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);margin-bottom:18px}
.adm-bar h1{font-size:26px}
.adm-status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.dirty{background:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--rose);font-weight:500}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input,.tools select{padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.tools input{flex:1 1 200px}
.sbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--radius);font-size:13px}
.sbtn:hover{border-color:var(--muted)}
.sbtn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sbtn.pri:hover{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.sbtn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 50%,var(--line))}
.sbtn.armed{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:32px;padding:6px 0;text-align:center}
.alist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.arow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.athumb{width:56px;height:56px;overflow:hidden;background:var(--tint);border-radius:2px}
.athumb img{width:100%;height:100%;object-fit:cover;display:block}
.athumb .ph b{font-size:24px}
.ainfo{min-width:0}
.ainfo b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ainfo small{color:var(--muted);font-size:12.5px}
.aact{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.editor{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:18px;display:grid;gap:18px}
.editor h2{font-size:26px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field input[type=text],.field input[type=url],.field select,.field textarea{padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);width:100%}
.field textarea{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.imgpick{display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px;align-items:center}
.imgpick .prev{aspect-ratio:1;background:var(--tint);overflow:hidden;border:1px solid var(--line)}
.imgpick .prev.wide{aspect-ratio:4/3}
.imgpick .prev img{width:100%;height:100%;object-fit:cover;display:block}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.inlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius)}
.inlist .arow{grid-template-columns:28px 44px minmax(0,1fr) auto;padding:8px 10px}
.inlist .athumb{width:44px;height:44px}
.inlist .n{font-family:var(--display);font-style:italic;color:var(--muted)}
.ed-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.ed-foot div{display:flex;gap:10px;flex-wrap:wrap}
.meter{height:6px;background:var(--tint);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.hi{background:var(--warn)}
.notice{padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);border-radius:var(--radius);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .byline{display:none}
}
@media (max-width:560px){
  .top-in{gap:10px;padding-block:12px}
  .mark{font-size:clamp(19px,5.6vw,24px)}
  .top-side{gap:8px;flex:none}
  .lang button{padding:4px 8px;font-size:11px}
  .admin-link{padding:7px;border-radius:50%}
  .admin-link .adm-txt{display:none}
  .chip{font-size:12.5px;padding:5px 12px}
  .grid{grid-template-columns:1fr 1fr;gap:20px 12px}
  .pcard{gap:8px}
  .pbody{gap:4px}
  .pbody .label{font-size:10px;letter-spacing:.12em}
  .pnote{font-size:13px;line-height:1.4}
  .prow{padding-top:4px}
  .prow .buy{width:100%;justify-content:center}
  .pnum{width:24px;height:24px;font-size:13px;top:6px;left:6px}
  .badge{top:6px;right:6px;font-size:9px;padding:2px 6px}
  .ph b{font-size:44px}
  .cgrid{grid-template-columns:1fr}
  .pbody h3{font-size:14.5px}
  .buy{padding:8px 10px;font-size:12.5px}
  .fgrid{grid-template-columns:1fr}
  .imgpick{grid-template-columns:96px minmax(0,1fr)}
  .arow{grid-template-columns:44px minmax(0,1fr)}
  .arow .aact{grid-column:1/-1;justify-content:start}
  .athumb{width:44px;height:44px}
  .inlist .arow{grid-template-columns:24px 40px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.login{max-width:420px;margin:40px auto;display:grid;gap:16px}
.login h2{font-size:32px}
.login p{margin:0;color:var(--muted)}
.login input{padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);width:100%}
.save-state{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.save-state.err{color:var(--rose)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.prog{font-size:13px;color:var(--muted)}
</style>
</head>

/* Fills gaps in saved data without deleting anything: fashion subcategories and products left without a category. */
function normalize(){

  if (cat("moda") && !kids("moda").length){
    [["vestidos","Vestidos"],["zapatos","Zapatos"],["bolsos","Bolsos"],["accesorios","Accesorios"]].forEach(function(x){
      var id = x[0]; while (cat(id)) id += "-moda";
      S.categories.push({ id:id, label:x[1], label_en:CAT_EN[x[0]], parent:"moda" });
    });
  }

    var c = cat(p.category);
    if (!c){ var g = guessCat(p); p.category = g; }
    else if (p.category === "moda"){ var g2 = guessCat(p); if (g2 && cat(g2) && cat(g2).parent === "moda") p.category = g2; }
  });

    var tally = {}, n = 0;
    c.productIds.map(prod).filter(Boolean).forEach(function(p){ var t = topOf(p.category); if (t){ tally[t] = (tally[t]||0) + 1; n++; } });
    var best = Object.keys(tally).sort(function(a,b){ return tally[b]-tally[a]; })[0];

/* Fills the English fields that are still empty, using a free translation service, so EN shows the whole page in English. */
var TR = { busy:false, timer:null };

function needsEn(o, k){
  var es = String(o[k]||"").trim(); if (!es) return false;
  var en = String(o[k+"_en"]||"").trim();
  if (!en) return true;
  return o[k+"_en_src"] != null && o[k+"_en_src"] !== es;
}
function decodeHtml(t){ var d = document.createElement("textarea"); d.innerHTML = t; return d.value; }
function chunks(t){
  var parts = String(t).match(/[^.!?\n]+[.!?]*\s*|\n/g) || [t], out = [], cur = "";
  parts.forEach(function(x){ if ((cur + x).length > 400 && cur){ out.push(cur); cur = ""; } cur += x; });
  if (cur) out.push(cur); return out;
}
function translateOne(t){
  return chunks(t).reduce(function(prev, piece){
    return prev.then(function(acc){
      if (!piece.trim()) return acc + piece;
      return fetch("https://api.mymemory.translated.net/get?langpair=es|en&q=" + encodeURIComponent(piece.trim()))
        .then(function(r){ return r.json(); })
        .then(function(j){
          var tx = j && j.responseData && j.responseData.translatedText;
          if (!tx || (j.responseStatus && +j.responseStatus !== 200) || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(tx)) throw new Error("tr");
          return acc + (acc && !/\s$/.test(acc) ? " " : "") + decodeHtml(tx);
        });
    });
  }, Promise.resolve(""));
}
function translateQueue(){
  var q = [];

    (S[list]||[]).forEach(function(o){
      TR_FIELDS[list].forEach(function(k){
        if (list === "categories" && !o.label_en && CAT_EN[o.id] && o.label === ({hogar:"Hogar",decoracion:"Decoración",cocina:"Cocina",moda:"Moda",belleza:"Belleza",individuales:"Productos individuales",vestidos:"Vestidos",zapatos:"Zapatos",bolsos:"Bolsos",accesorios:"Accesorios"})[o.id]) return;
        if (needsEn(o, k)) q.push([o, k]);
      });
    });
  });
  ["welcomeText","welcomeSign","welcomeKicker","tagline"].forEach(function(k){ if (needsEn(S.settings, k)) q.push([S.settings, k]); });
  return q;
}
function autoTranslate(){
  if (!canEdit || TR.busy || DATA.state !== "ok") return;
  var q = translateQueue(); if (!q.length) return;
  TR.busy = true; var done = 0, failed = false;
  q.reduce(function(prev, item){
    return prev.then(function(){
      if (failed) return;
      var o = item[0], k = item[1], src = String(o[k]).trim();
      return translateOne(src).then(function(en){ o[k+"_en"] = en; o[k+"_en_src"] = src; done++; })
        .catch(function(){ failed = true; });
    });
  }, Promise.resolve()).then(function(){
    TR.busy = false;
    if (done){ saveNow(); if (location.hash !== "#admin" || !A.edit) render(); toast(done === 1 ? "1 texto traducido al inglés." : done + " textos traducidos al inglés."); }
    if (failed) toast("Algunos textos no se pudieron traducir al inglés. Se intentará de nuevo más tarde.");

}

function flush(){

  if (DATA.state !== "ok"){ save.inflight = false; save.state = "error"; save.err = "No se cargaron tus datos, así que no se guardó nada. Recarga la página."; paintSave(); return; }

    .then(function(r){ save.state = "saved"; save.at = r && r.savedAt; DATA.base = (r && r.savedAt) || DATA.base; S.savedAt = DATA.base; })

function prepImage(file, max){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.round(img.naturalWidth*s), h = Math.round(img.naturalHeight*s);
      var cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      var x = cv.getContext("2d"); x.fillStyle="#ffffff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b ? res(b) : rej(new Error("bad")); }, "image/jpeg", 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("bad")); };
    img.src = url;
  });
}
function uploadImage(file, max){

function welcome(){
  var s = S.settings, ph = safeImg(s.welcomePhoto);
  var title = esc(noVitrina(s.welcomeTitle) || siteName()).replace(/\s(Edit)$/i, " <i>$1</i>");
  var initials = (noVitrina(s.welcomeTitle) || siteName()).replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w.charAt(0).toUpperCase();}).join("");
  var brand = safeUrl(s.brandUrl);
  var text = L(s,"welcomeText"); if (text == null) text = L(s,"tagline");
  var sign = L(s,"welcomeSign");
  return '<section class="welcome"><figure class="portrait"><div class="arch"><div class="arch-in">'+(ph?'<img src="'+esc(ph)+'" alt="'+esc(sign||T("founderPhoto"))+'">':'<span class="mono">'+esc(initials||"ER")+'</span>')+'</div></div></figure>'+
    '<div class="welcome-text"><span class="label">'+esc(L(s,"welcomeKicker")||T("welcome"))+'</span><h1>'+title+'</h1>'+
    (text?'<p>'+esc(text)+'</p>':'')+
    (sign?'<span class="sign">'+esc(sign)+'</span>':'')+
    '<div class="welcome-actions"><a class="btn" href="#colecciones">'+T("seeRooms")+' '+ARROW+'</a>'+(brand?'<a class="btn ghost" href="'+esc(brand)+'" target="_blank" rel="noopener">'+T("meet")+'</a>':'')+'</div></div></section>';
}
function viewHome(){
  var feat = S.collections.filter(function(c){return c.featured;})[0] || S.collections[0];
  var h = header("all") + '<main class="wrap">' + welcome() + '<div id="colecciones"></div>';
  if (feat){
    var items = collProducts(feat);
    h += '<section class="hero"><figure class="window"><a class="scene" href="#c-'+esc(feat.id)+'">'+sceneImg(feat)+'</a></figure><div class="hero-text"><span class="label">'+esc(L(feat,"kicker")||T("featured"))+'</span><h2>'+esc(L(feat,"title"))+'</h2><p class="desc">'+esc(L(feat,"desc"))+'</p><a class="btn" href="#c-'+esc(feat.id)+'">'+T("shopRoom")+' '+ARROW+'</a><p class="count">'+items.length+T("inScene")+'</p></div></section>';
    if (items.length) h += '<section class="sec"><div class="sec-head"><div><span class="label">'+T("seenInScene")+'</span><h2>'+T("pieceBy")+'</h2></div></div>'+grid(items, true)+'</section>';
  } else {
    h += '<section class="hero"><div class="hero-text"><span class="label">'+T("collections")+'</span><h2>'+esc(L(S.settings,"tagline"))+'</h2></div></section>';
  }
  var others = S.collections.filter(function(c){ return c !== feat; });
  if (others.length) h += '<section class="sec"><div class="sec-head"><div><span class="label">'+T("rooms")+'</span><h2>'+T("moreColl")+'</h2></div></div><div class="cgrid">'+others.map(ccard).join("")+'</div></section>';
  h += '<section class="sec"><div class="sec-head"><div><span class="label">'+T("catalog")+'</span><h2>'+T("allSel")+'</h2></div><p class="count">'+esc(L(S.settings,"tagline"))+'</p></div>'+grid(S.products)+'</section>';
  return h + '</main>' + footer();
}
function viewCat(id){
  var c = cat(id); if (!c) return viewHome();
  var fam = familyIds(id);
  var ps = S.products.filter(function(p){return fam.indexOf(p.category)>=0;});
  var cs = S.collections.filter(function(x){return fam.indexOf(x.category)>=0;});
  var parent = (c.parent && cat(c.parent)) ? cat(c.parent) : c, subs = kids(parent.id), sub = "";
  if (subs.length){
    sub = '<div class="subcats"><a class="chip'+(parent.id===id?" on":"")+'" href="#cat-'+esc(parent.id)+'">'+T("all")+'</a>'+
      subs.map(function(k){ return '<a class="chip'+(k.id===id?" on":"")+'" href="#cat-'+esc(k.id)+'">'+esc(catName(k.id))+'</a>'; }).join("")+'</div>';
  }
  var h = header(id) + '<main class="wrap"><div class="chead"><span class="label">'+(parent.id!==id?esc(catName(parent.id)):T("category"))+'</span><h1>'+esc(catName(id))+'</h1><p>'+ps.length+T("products")+(cs.length?' · '+cs.length+T("roomsN"):'')+'</p>'+sub+'</div>';
  if (cs.length) h += '<section class="sec"><div class="sec-head"><div><span class="label">'+T("rooms")+'</span><h2>'+T("collections")+'</h2></div></div><div class="cgrid">'+cs.map(ccard).join("")+'</div></section>';
  h += '<section class="sec">'+(cs.length?'<div class="sec-head"><div><span class="label">'+T("catalog")+'</span><h2>'+T("allProducts")+'</h2></div></div>':'')+grid(ps)+'</section>';
  return h + '</main>' + footer();
}
function viewColl(id){
  var c = coll(id); if (!c) return viewHome();
  var items = collProducts(c);
  var h = header(c.category) + '<main class="wrap"><p class="crumb"><a href="#inicio">'+T("home")+'</a> / <a href="#cat-'+esc(c.category)+'">'+esc(catName(c.category))+'</a></p>';
  h += '<div class="chead"><span class="label">'+esc(L(c,"kicker")||T("collection"))+'</span><h1>'+esc(L(c,"title"))+'</h1><p>'+esc(L(c,"desc"))+'</p></div>';
  h += '<figure class="wide-window"><div class="scene">'+sceneImg(c)+'</div></figure>';
  h += '<section class="sec"><div class="sec-head"><div><span class="label">'+items.length+' '+T("pieces")+'</span><h2>'+T("shopThis")+'</h2></div></div>'+grid(items, true)+'</section>';
  return h + '</main>' + footer();
}

/* ---------- admin ---------- */
function thumb(src, fallback){ var s = safeImg(src); return '<div class="athumb">'+(s?'<img src="'+esc(s)+'" alt="">':fallback)+'</div>'; }
function delBtn(key, label){ var armed = A.armed===key; return '<button class="sbtn danger'+(armed?' armed':'')+'" data-act="del" data-key="'+esc(key)+'">'+(armed?'Confirmar: eliminar':(label||'Eliminar'))+'</button>'; }

function viewLogin(){
  return header("") + '<main class="wrap"><form class="login" id="login-form"><span class="label">Panel de administración</span><h2>Entrar</h2><p>Escribe la contraseña que pusiste en Netlify.</p>'+
    '<input type="password" id="l-pw" autocomplete="current-password" aria-label="Contraseña" placeholder="Contraseña" required>'+
    '<label class="check"><input type="checkbox" id="l-remember" checked> Recordarme en este dispositivo</label>'+
    (A.loginErr?'<p style="color:var(--rose)">'+esc(A.loginErr)+'</p>':'')+
    '<button class="btn" type="submit"'+(A.loggingIn?' disabled':'')+'>'+(A.loggingIn?'Entrando…':'Entrar')+'</button></form></main>';
}
function viewAdmin(){
  if (!canEdit) return viewLogin();
  var h = header("") + '<main class="wrap adm">';
  h += '<div class="adm-bar"><div><h1>Panel</h1><div id="save-state" class="save-state"></div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="sbtn" href="#inicio" style="text-decoration:none">Ver sitio</a><button class="sbtn" data-act="logout">Salir</button></div></div>';
  var tabs = [["collections","Colecciones"],["products","Productos"],["categories","Categorías"],["settings","Bienvenida y ajustes"]];
  h += '<div class="tabs" role="tablist">'+tabs.map(function(t){ return '<button class="tab'+(A.tab===t[0]?' on':'')+'" data-act="tab" data-tab="'+t[0]+'">'+t[1]+'</button>'; }).join("")+'</div>';
  if (A.edit) h += A.edit.kind==="p" ? editProduct() : editCollection();
  else if (A.tab==="collections") h += listCollections();
  else if (A.tab==="products") h += listProducts();
  else if (A.tab==="categories") h += listCategories();
  else h += editSettings();
  return h + '</main>';
}
function listCollections(){
  var h = '<div class="tools"><button class="sbtn pri" data-act="new-c">Nueva colección</button><span class="hint">La primera colección marcada como destacada aparece en la portada.</span></div>';
  if (!S.collections.length) return h + '<p class="empty">Aún no hay colecciones. Crea la primera con una imagen de ambiente.</p>';
  h += '<div class="alist">';
  S.collections.forEach(function(c,i){
    h += '<div class="arow">'+thumb(c.image,'<div class="ph"><b>'+esc(c.title.charAt(0))+'</b></div>')+'<div class="ainfo"><b>'+esc(c.title)+'</b><small>'+(c.featured?'Destacada · ':'')+collProducts(c).length+' productos · '+esc(catLabel(c.category))+(c.example?' · Ejemplo':'')+'</small></div><div class="aact">'+
      '<button class="sbtn icon" data-act="move" data-kind="c" data-id="'+c.id+'" data-d="-1"'+(i===0?' disabled':'')+' aria-label="Subir">↑</button><button class="sbtn icon" data-act="move" data-kind="c" data-id="'+c.id+'" data-d="1"'+(i===S.collections.length-1?' disabled':'')+' aria-label="Bajar">↓</button>'+
      '<button class="sbtn" data-act="edit" data-kind="c" data-id="'+c.id+'">Editar</button></div></div>';
  });
  return h + '</div>';
}
function listProducts(){
  var h = '<div class="tools"><button class="sbtn pri" data-act="new-p">Nuevo producto</button><input type="search" id="a-q" placeholder="Buscar producto" value="'+esc(A.q)+'"><select id="a-qcat" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option>'+S.categories.map(function(c){return '<option value="'+esc(c.id)+'"'+(A.qcat===c.id?' selected':'')+'>'+esc(c.label)+'</option>';}).join("")+'</select>';
  if (S.products.some(function(p){return p.example;}) || S.collections.some(function(c){return c.example;})) h += delBtn("examples","Quitar ejemplos");
  h += '</div>';
  var q = A.q.toLowerCase();
  var list = S.products.filter(function(p){ return (!A.qcat || p.category===A.qcat) && (!q || p.name.toLowerCase().indexOf(q)>=0); });
  if (!list.length) return h + '<p class="empty">'+(S.products.length?'Ningún producto coincide con la búsqueda.':'Aún no hay productos. Añade el primero con su foto y tu enlace de afiliada.')+'</p>';
  var filtered = !!(q || A.qcat);
  h += '<div class="alist">';
  list.forEach(function(p){
    var i = S.products.indexOf(p);
    var inC = S.collections.filter(function(c){return (c.productIds||[]).indexOf(p.id)>=0;}).length;
    h += '<div class="arow">'+thumb(p.image, phProduct(p))+'<div class="ainfo"><b>'+esc(p.name)+'</b><small>'+esc(storeName(p))+' · '+esc(catLabel(p.category))+(inC?' · en '+inC+(inC===1?' colección':' colecciones'):'')+(linkFor(p)?'':' · sin enlace')+(p.example?' · Ejemplo':'')+'</small></div><div class="aact">'+
      (filtered?'':'<button class="sbtn icon" data-act="move" data-kind="p" data-id="'+p.id+'" data-d="-1"'+(i===0?' disabled':'')+' aria-label="Subir">↑</button><button class="sbtn icon" data-act="move" data-kind="p" data-id="'+p.id+'" data-d="1"'+(i===S.products.length-1?' disabled':'')+' aria-label="Bajar">↓</button>')+
      '<button class="sbtn pri" data-act="edit" data-kind="p" data-id="'+p.id+'">Editar foto y link</button></div></div>';
  });
  return h + '</div>';
}
function listCategories(){
  var parents = topCats();
  var h = '<div class="tools"><input type="text" id="a-newcat" placeholder="Nombre de la nueva categoría o subcategoría"><select id="a-newparent" aria-label="Dentro de"><option value="">Categoría principal</option>'+parents.map(function(c){ return '<option value="'+esc(c.id)+'">Dentro de '+esc(c.label)+'</option>'; }).join("")+'</select><button class="sbtn pri" data-act="add-cat">Añadir</button></div><div class="alist">';
  var ordered = []; parents.forEach(function(c){ ordered.push(c); kids(c.id).forEach(function(k){ ordered.push(k); }); });
  ordered.forEach(function(c){
    var i = S.categories.indexOf(c), isSub = !!(c.parent && cat(c.parent)), hasKids = kids(c.id).length > 0;
    var n = S.products.filter(function(p){return p.category===c.id;}).length;
    var psel = hasKids ? '' : '<select data-cat-parent="'+esc(c.id)+'" aria-label="Dentro de"><option value="">Categoría principal</option>'+parents.filter(function(x){return x.id!==c.id;}).map(function(x){ return '<option value="'+esc(x.id)+'"'+(c.parent===x.id?' selected':'')+'>Dentro de '+esc(x.label)+'</option>'; }).join("")+'</select>';
    h += '<div class="arow" style="grid-template-columns:minmax(0,1fr) auto'+(isSub?';padding-left:32px;background:var(--paper)':'')+'"><div class="field">'+(isSub?'<small class="hint">Subcategoría de '+esc(cat(c.parent).label)+'</small>':'')+'<input type="text" data-cat="'+esc(c.id)+'" value="'+esc(c.label)+'" aria-label="Nombre de la categoría"><input type="text" data-cat-en="'+esc(c.id)+'" value="'+esc(c.label_en||"")+'" placeholder="'+esc(CAT_EN[c.id]||"English name")+'" aria-label="Nombre en inglés">'+psel+'<small class="hint">'+n+' productos · arriba en español, abajo en inglés</small></div><div class="aact">'+
      '<button class="sbtn icon" data-act="move" data-kind="k" data-id="'+esc(c.id)+'" data-d="-1"'+(i===0?' disabled':'')+' aria-label="Subir">↑</button><button class="sbtn icon" data-act="move" data-kind="k" data-id="'+esc(c.id)+'" data-d="1"'+(i===S.categories.length-1?' disabled':'')+' aria-label="Bajar">↓</button>'+
      delBtn("cat:"+c.id)+'</div></div>';
  });
  return h + '</div><p class="hint" style="margin-top:10px">Las subcategorías aparecen dentro de su categoría principal (por ejemplo, Moda › Vestidos). Al eliminar una subcategoría, sus productos pasan a la categoría principal.</p>';
}
function backupsBox(){
  var h = '<div class="editor" style="margin-top:18px"><h2>Copias de seguridad</h2><p class="hint" style="margin-top:-8px">Cada vez que se guarda un cambio, queda una copia de cómo estaba antes. Si algo desapareció, restaura una copia anterior.</p>';
  if (!A.backups) return h + '<div><button class="sbtn" data-act="load-backups">Ver copias guardadas</button></div></div>';
  if (A.backups === "loading") return h + '<p class="prog">Cargando copias…</p></div>';
  if (!A.backups.length) return h + '<p class="hint">Todavía no hay copias guardadas.</p></div>';
  h += '<div class="alist">';
  A.backups.forEach(function(b){
    var d = new Date(b.savedAt), when = isNaN(d) ? b.savedAt : d.toLocaleString("es", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
    h += '<div class="arow" style="grid-template-columns:minmax(0,1fr) auto"><div class="ainfo"><b>'+esc(when)+'</b><small>'+b.products+' productos · '+b.collections+' colecciones'+(b.titles.length?' · '+esc(b.titles.join(", ")):'')+(b.examples?' · incluye ejemplos':'')+'</small></div><div class="aact">'+delBtn("restore:"+b.key, "Restaurar").replace("Confirmar: eliminar","Confirmar: restaurar")+'</div></div>';
  });
  return h + '</div></div>';
}
function editSettings(){ return editSettingsMain() + backupsBox(); }
function editSettingsMain(){
  var s = S.settings, ph = safeImg(s.welcomePhoto);
  return '<div class="editor"><h2>Bienvenida de la portada</h2><p class="hint" style="margin-top:-8px">Es lo primero que ve la gente al entrar a tu web.</p><div class="fgrid">'+
    '<div class="field full"><label>Tu fotografía</label><div class="imgpick"><div class="prev" style="aspect-ratio:4/5;border-radius:999px 999px 4px 4px">'+(ph?'<img src="'+esc(ph)+'" alt="">':'<div class="ph"><small>Sin foto</small></div>')+'</div><div class="field"><input type="file" id="s-photo" accept="image/*"'+(A.uploading?' disabled':'')+'>'+
    (A.uploading?'<p class="prog">Subiendo la foto…</p>':'<p class="hint">Una foto tuya o de tu trabajo. Se recorta en forma de arco; las fotos verticales quedan mejor.</p>')+
    (ph&&!A.uploading?'<button class="sbtn" data-act="clear-photo" style="width:fit-content">Quitar foto</button>':'')+'</div></div></div>'+
    fld("s-welcomeTitle","Nombre que aparece en grande",s.welcomeTitle||"","full","text",s.name||"Eyre Roses Decor Edit")+
    '<div class="field full"><label for="s-welcomeText">Presentación breve</label><textarea id="s-welcomeText" placeholder="Cuéntale a tu visita quién eres y qué va a encontrar aquí.">'+esc(s.welcomeText||"")+'</textarea><p class="hint">Dos o tres frases. Puedes usar Enter para separar párrafos.</p></div>'+
    '<div class="field full"><label for="s-welcomeText_en">Presentación en inglés (opcional)</label><textarea id="s-welcomeText_en" placeholder="Tell your visitors who you are and what they will find here.">'+esc(s.welcomeText_en||"")+'</textarea></div>'+
    fld("s-welcomeSign","Firma (opcional)",s.welcomeSign||"","","text","Con cariño, Eyre")+fld("s-welcomeSign_en","Firma en inglés",s.welcomeSign_en||"","","text","With love, Eyre")+
    fld("s-welcomeKicker","Etiqueta pequeña de arriba",s.welcomeKicker||"","","text","Bienvenida")+fld("s-welcomeKicker_en","Etiqueta en inglés",s.welcomeKicker_en||"","","text","Welcome")+
    '</div><div class="ed-foot"><span></span><div><button class="sbtn pri" data-act="save-settings">Guardar bienvenida y ajustes</button></div></div></div>'+
    '<div class="editor" style="margin-top:18px"><h2>Ajustes del sitio</h2><div class="fgrid">'+
    fld("s-name","Nombre del sitio",siteName())+fld("s-brandName","Texto junto al logo (opcional)",s.brandName)+
    fld("s-tagline","Frase del catálogo",s.tagline,"full")+fld("s-tagline_en","Frase del catálogo en inglés",s.tagline_en||"","full","text","Complete rooms to inspire you, with every piece one click away.")+
    fld("s-brandUrl","Enlace a EyreRosesDecor (Instagram, web o TikTok)",s.brandUrl,"full","url","https://…")+
    '<div class="field full"><label for="s-amazonTag">Tu ID de asociada de Amazon</label><input type="text" id="s-amazonTag" value="'+esc(s.amazonTag||"")+'" placeholder="eyreroses-20"><p class="hint">Lo ves arriba a la izquierda en Amazon Asociados y termina en -20. Se añade solo a los productos de Amazon para que la comisión sea tuya.</p></div>'+
    '<div class="field full"><label for="s-disclosure">Aviso de afiliados</label><textarea id="s-disclosure">'+esc(s.disclosure)+'</textarea><p class="hint">Amazon exige que este aviso sea visible en el sitio.</p></div>'+
    '<div class="field full"><label for="s-disclosure_en">Aviso de afiliados en inglés</label><textarea id="s-disclosure_en" placeholder="'+esc(DEFAULT_DISCLOSURE_EN)+'">'+esc(s.disclosure_en||"")+'</textarea><p class="hint">Si lo dejas vacío, se usa el texto oficial de Amazon en inglés.</p></div>'+
    '</div><div class="ed-foot"><span></span><div><button class="sbtn pri" data-act="save-settings">Guardar ajustes</button></div></div></div>';
}
function fld(id,label,val,cls,type,ph){ return '<div class="field'+(cls?' '+cls:'')+'"><label for="'+id+'">'+label+'</label><input type="'+(type||"text")+'" id="'+id+'" value="'+esc(val)+'"'+(ph?' placeholder="'+ph+'"':'')+'></div>'; }
function catSelect(id, val){
  var o = '<select id="'+id+'"><option value="">Sin categoría</option>';
  topCats().forEach(function(c){
    var ks = kids(c.id);
    if (!ks.length){ o += '<option value="'+esc(c.id)+'"'+(val===c.id?' selected':'')+'>'+esc(c.label)+'</option>'; return; }
    o += '<optgroup label="'+esc(c.label)+'"><option value="'+esc(c.id)+'"'+(val===c.id?' selected':'')+'>'+esc(c.label)+' (general)</option>';
    ks.forEach(function(k){ o += '<option value="'+esc(k.id)+'"'+(val===k.id?' selected':'')+'>'+esc(k.label)+'</option>'; });
    o += '</optgroup>';
  });
  return o + '</select>';
}
function imgPicker(f, wide){
  var s = safeImg(f.image);
  return '<div class="field full"><label>'+(wide?'Imagen de ambiente':'Fotografía del producto')+'</label><div class="imgpick"><div class="prev'+(wide?' wide':'')+'">'+(s?'<img src="'+esc(s)+'" alt="">':'<div class="ph"><small>Sin imagen</small></div>')+'</div><div class="field"><input type="file" id="f-img" accept="image/*"'+(A.uploading?' disabled':'')+'>'+
    (A.uploading?'<p class="prog">Subiendo la foto…</p>':'<p class="hint">'+(wide?'Sube tu imagen creada con IA. Se ajusta a 2000 px.':'JPG, PNG o WebP. Se ajusta a 1200 px.')+'</p>')+
    (s&&!A.uploading?'<button class="sbtn" data-act="clear-img" style="width:fit-content">Quitar imagen</button>':'')+'</div></div></div>';
}
function editProduct(){
  var f = A.edit.f;
  var h = '<div class="editor">'+(A.back?'<button class="sbtn" data-act="cancel" style="width:fit-content">← Volver a la colección</button>':'')+'<h2>'+(A.edit.isNew?'Nuevo producto':'Editar producto')+'</h2><div class="fgrid">'+
    fld("f-name","Nombre",f.name,"full")+
    fld("f-name_en","Nombre en inglés (opcional)",f.name_en||"","full","text","Ej.: Washed linen table runner")+
    '<div class="field"><label for="f-store">Tienda</label><select id="f-store">'+STORES.map(function(s){return '<option'+(f.store===s?' selected':'')+'>'+s+'</option>';}).join("")+'</select></div>'+
    (f.store==="Otra"?fld("f-storeLabel","Nombre de la tienda",f.storeLabel):'')+
    '<div class="field"><label for="f-category">Categoría</label>'+catSelect("f-category",f.category)+'</div>'+
    fld("f-price","Precio (opcional)",f.price,"","text","$29.99")+
    '<div class="field full"><label for="f-url">Enlace del producto o número ASIN</label><input type="text" id="f-url" value="'+esc(f.url)+'" placeholder="https://amzn.to/… o B0CXYZ1234"><p class="hint">Pega el enlace que te da Amazon Asociados (SiteStripe) para este producto, o solo su número ASIN. El botón lleva directo a ese producto.'+(S.settings.amazonTag?'':' Para usar el ASIN, pon tu ID de asociada en Ajustes.')+'</p></div>'+
    '<div class="field full"><label for="f-note">Nota corta (opcional)</label><input type="text" id="f-note" value="'+esc(f.note)+'" placeholder="Por qué te gusta esta pieza"></div>'+
    fld("f-note_en","Nota en inglés (opcional)",f.note_en||"","full","text","Why you love this piece")+
    imgPicker(f,false);
  if (S.collections.length){
    h += '<div class="field full"><label>Aparece en estas colecciones</label><div class="checks">'+S.collections.map(function(c){ return '<label class="check"><input type="checkbox" data-incoll="'+c.id+'"'+(f.colls.indexOf(c.id)>=0?' checked':'')+'> '+esc(c.title)+'</label>'; }).join("")+'</div></div>';
  }
  h += '</div><div class="ed-foot">'+(A.edit.isNew?'<span></span>':delBtn("p:"+A.edit.id))+'<div><button class="sbtn" data-act="cancel">Cancelar</button><button class="sbtn pri" data-act="save-p"'+(A.uploading?' disabled':'')+'>Guardar producto</button></div></div></div>';
  return h;
}
function editCollection(){
  var f = A.edit.f;
  var h = '<div class="editor"><h2>'+(A.edit.isNew?'Nueva colección':'Editar colección')+'</h2><div class="fgrid">'+
    fld("f-title","Título",f.title,"full")+fld("f-title_en","Título en inglés (opcional)",f.title_en||"","full","text","Ej.: Christmas in forest green and gold")+
    fld("f-kicker","Etiqueta corta",f.kicker,"","text","Navidad · Mesa para 6")+fld("f-kicker_en","Etiqueta en inglés",f.kicker_en||"","","text","Christmas · Table for 6")+
    '<div class="field"><label for="f-category">Categoría</label>'+catSelect("f-category",f.category)+'</div>'+
    '<div class="field full"><label for="f-desc">Descripción</label><textarea id="f-desc">'+esc(f.desc)+'</textarea></div>'+
    '<div class="field full"><label for="f-desc_en">Descripción en inglés (opcional)</label><textarea id="f-desc_en">'+esc(f.desc_en||"")+'</textarea></div>'+
    '<div class="field full"><label class="check" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" id="f-featured"'+(f.featured?' checked':'')+'> Destacar en la portada</label></div>'+
    imgPicker(f,true)+
    '<div class="field full"><label>Productos en esta escena, en orden</label>';
  if (f.productIds.length){
    h += '<div class="inlist">'+f.productIds.map(function(id,i){ var p = prod(id); if(!p) return ""; return '<div class="arow"><span class="n">'+(i+1)+'</span>'+thumb(p.image,phProduct(p))+'<div class="ainfo"><b>'+esc(p.name)+'</b><small>'+esc(storeName(p))+'</small></div><div class="aact"><button class="sbtn icon" data-act="cmove" data-i="'+i+'" data-d="-1"'+(i===0?' disabled':'')+' aria-label="Subir">↑</button><button class="sbtn icon" data-act="cmove" data-i="'+i+'" data-d="1"'+(i===f.productIds.length-1?' disabled':'')+' aria-label="Bajar">↓</button><button class="sbtn pri" data-act="cedit-p" data-i="'+i+'">Editar foto y link</button><button class="sbtn" data-act="cremove" data-i="'+i+'">Quitar</button></div></div>'; }).join("")+'</div>';
  } else h += '<p class="hint">Aún no hay productos en esta colección.</p>';
  var avail = S.products.filter(function(p){ return f.productIds.indexOf(p.id)<0; });
  h += '<div class="tools" style="margin:10px 0 0"><button class="sbtn pri" data-act="cnew-p">Nuevo producto para esta escena</button></div>';
  h += avail.length ? '<div class="tools" style="margin:10px 0 0"><select id="f-addp" style="flex:1 1 220px" aria-label="Producto para añadir">'+avail.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("")+'</select><button class="sbtn" data-act="cadd">Añadir a la escena</button></div>' : '<p class="hint">Crea productos en la pestaña Productos para añadirlos aquí.</p>';
  h += '</div></div><div class="ed-foot">'+(A.edit.isNew?'<span></span>':delBtn("c:"+A.edit.id))+'<div><button class="sbtn" data-act="cancel">Cancelar</button><button class="sbtn pri" data-act="save-c"'+(A.uploading?' disabled':'')+'>Guardar colección</button></div></div></div>';
  return h;
}
function readSettings(){
  var s = S.settings, map = { name:"s-name", brandName:"s-brandName", tagline:"s-tagline", brandUrl:"s-brandUrl", disclosure:"s-disclosure", welcomeTitle:"s-welcomeTitle", welcomeText:"s-welcomeText", welcomeSign:"s-welcomeSign", welcomeKicker:"s-welcomeKicker", welcomeText_en:"s-welcomeText_en", welcomeSign_en:"s-welcomeSign_en", welcomeKicker_en:"s-welcomeKicker_en", tagline_en:"s-tagline_en", disclosure_en:"s-disclosure_en" };
  Object.keys(map).forEach(function(k){ var v = val(map[k]); if (v !== undefined){ if (/_en$/.test(k) && s[k] !== v) delete s[k+"_src"]; s[k] = v; } });
  var tag = val("s-amazonTag"); if (tag !== undefined) s.amazonTag = tag.replace(/\s+/g,"");
  if (!s.name) s.name = "Eyre Roses Decor Edit";
}
function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : undefined; }
function syncForm(){
  if (!A.edit) return; var f = A.edit.f;
  ["name","name_en","storeLabel","price","url","note","note_en","title","title_en","kicker","kicker_en","desc","desc_en","category","store"].forEach(function(k){ var v = val("f-"+k); if (v !== undefined) f[k] = v; });
  var fe = document.getElementById("f-featured"); if (fe) f.featured = fe.checked;
  var boxes = document.querySelectorAll("[data-incoll]"); if (boxes.length){ f.colls = []; boxes.forEach(function(b){ if (b.checked) f.colls.push(b.getAttribute("data-incoll")); }); }
}
function startEdit(kind, id){
  A.armed = null;
  if (kind==="p"){
    var p = id ? prod(id) : null;
    var f = p ? JSON.parse(JSON.stringify(p)) : { name:"", store:"Amazon", storeLabel:"", url:"", price:"", category: A.qcat || "", note:"", image:"" };
    f.colls = S.collections.filter(function(c){ return p && (c.productIds||[]).indexOf(p.id)>=0; }).map(function(c){return c.id;});
    A.edit = { kind:"p", id: p ? p.id : uid("p"), isNew: !p, f: f };
  } else {
    var c = id ? coll(id) : null;
    A.edit = { kind:"c", id: c ? c.id : uid("c"), isNew: !c, f: c ? JSON.parse(JSON.stringify(c)) : { title:"", kicker:"", desc:"", category:"", featured:false, image:"", productIds:[] } };
  }
  render(); window.scrollTo(0,0);
}
function saveProduct(){
  syncForm(); var f = A.edit.f;
  if (!f.name){ toast("Escribe el nombre del producto."); return; }
  if (f.url && !linkFor({url:f.url})){ toast("Pega el enlace completo (https://…) o el número ASIN de 10 caracteres."); return; }
  var p = { id:A.edit.id, name:f.name, store:f.store, storeLabel:f.store==="Otra"?f.storeLabel:"", url:f.url, price:f.price, category:f.category, note:f.note, name_en:f.name_en||"", note_en:f.note_en||"", image:f.image||"", example:false };
  carrySrc(p, prod(p.id), ["name","note"]);
  var i = S.products.findIndex(function(x){return x.id===p.id;});
  if (i>=0) S.products[i] = p; else S.products.unshift(p);
  S.collections.forEach(function(c){
    c.productIds = c.productIds || [];
    var has = c.productIds.indexOf(p.id), want = f.colls.indexOf(c.id)>=0;
    if (want && has<0) c.productIds.push(p.id);
    if (!want && has>=0) c.productIds.splice(has,1);
  });
  if (A.back){
    if (A.back.f.productIds.indexOf(p.id) < 0 && A.fromColl) A.back.f.productIds.push(p.id);
    A.edit = A.back; A.back = null; A.fromColl = false;
  } else A.edit = null;
  changed(); render(); window.scrollTo(0,0); toast("Producto guardado.");
}
function saveCollection(){
  syncForm(); var f = A.edit.f;
  if (!f.title){ toast("Escribe el título de la colección."); return; }
  var old = coll(A.edit.id);
  var c = { id:A.edit.id, title:f.title, kicker:f.kicker, desc:f.desc, title_en:f.title_en||"", kicker_en:f.kicker_en||"", desc_en:f.desc_en||"", category:f.category, featured:!!f.featured, image:f.image||"", productIds:f.productIds.slice(), example:false };
  if (old && old.tones) c.tones = old.tones;
  carrySrc(c, old, ["title","kicker","desc"]);
  var i = S.collections.findIndex(function(x){return x.id===c.id;});
  if (i>=0) S.collections[i] = c; else S.collections.unshift(c);
  if (c.featured){ S.collections = S.collections.filter(function(x){return x.id!==c.id;}); S.collections.unshift(c); }
  A.edit = null; changed(); render(); toast("Colección guardada.");
}
function login(e){
  e.preventDefault();
  var given = val("l-pw"), remember = document.getElementById("l-remember").checked;
  if (!given) return;
  A.loggingIn = true; A.loginErr = ""; render();
  pw = given;
  api("/api/login", { method: "POST" }).then(function(){
    canEdit = true; A.loggingIn = false; setTimeout(autoTranslate, 1200);
    if (remember) lsSet(PW_KEY, pw); else ssSet(PW_KEY, pw);
    render();
  }).catch(function(err){
    pw = ""; A.loggingIn = false;
    A.loginErr = err.status === 401 ? "Contraseña incorrecta." : err.status === 404 ? "El panel solo funciona cuando el sitio está publicado en Netlify." : err.message;
    render();
  });
}

/* ---------- events ---------- */
root.addEventListener("submit", function(e){ if (e.target.id === "login-form") login(e); });
root.addEventListener("click", function(e){
  var lb = e.target.closest("[data-lang]"); if (lb){ setLang(lb.getAttribute("data-lang")); return; }
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), kind = b.getAttribute("data-kind");
  if (act !== "del") A.armed = null;
  syncForm();
  switch(act){
    case "tab": A.tab = b.getAttribute("data-tab"); A.edit = null; A.back = null; render(); break;
    case "new-p": startEdit("p"); break;
    case "new-c": startEdit("c"); break;
    case "edit": startEdit(kind, id); break;
    case "cancel": if (A.back){ A.edit = A.back; A.back = null; A.fromColl = false; } else A.edit = null; render(); break;
    case "cedit-p": { var pid0 = A.edit.f.productIds[+b.getAttribute("data-i")]; A.back = A.edit; A.fromColl = false; startEdit("p", pid0); break; }
    case "cnew-p": A.back = A.edit; A.fromColl = true; startEdit("p"); break;
    case "save-p": saveProduct(); break;
    case "save-c": saveCollection(); break;
    case "clear-img": A.edit.f.image = ""; render(); break;
    case "retry": flush(); break;
    case "reload": location.reload(); break;
    case "logout": forget(); pw = ""; canEdit = false; A.edit = null; location.hash = "inicio"; break;
    case "move": {
      var arr = kind==="p" ? S.products : kind==="c" ? S.collections : S.categories;
      var i = arr.findIndex(function(x){return x.id===id;}), j = i + Number(b.getAttribute("data-d"));
      if (i<0 || j<0 || j>=arr.length) break;
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t; changed(); render(); break;
    }
    case "cmove": { var L = A.edit.f.productIds, a = +b.getAttribute("data-i"), d = a + Number(b.getAttribute("data-d")); var t2 = L[a]; L[a] = L[d]; L[d] = t2; render(); break; }
    case "cremove": A.edit.f.productIds.splice(+b.getAttribute("data-i"),1); render(); break;
    case "cadd": { var v = val("f-addp"); if (v) A.edit.f.productIds.push(v); render(); break; }
    case "add-cat": {
      var name = val("a-newcat"); if (!name){ toast("Escribe el nombre de la categoría."); break; }
      var cid = slug(name); while (cat(cid)) cid += "-2";
      var par = val("a-newparent") || "";
      var nc = { id:cid, label:name }; if (par) nc.parent = par;
      S.categories.push(nc); changed(); render(); toast(par ? "Subcategoría añadida." : "Categoría añadida."); break;
    }
    case "clear-photo": readSettings(); S.settings.welcomePhoto = ""; changed(); render(); break;
    case "save-settings": {
      var url = val("s-brandUrl");
      if (url && !safeUrl(url)){ toast("El enlace debe empezar con https://"); break; }
      readSettings();
      changed(); render(); toast("Ajustes guardados."); break;
    }
    case "load-backups":
      A.backups = "loading"; render();
      api("/api/backups").then(function(r){ A.backups = (r && r.backups) || []; render(); }).catch(function(){ A.backups = null; render(); toast("No se pudieron cargar las copias. Inténtalo de nuevo."); });
      break;
    case "del": {
      var key = b.getAttribute("data-key");
      if (A.armed !== key){ A.armed = key; render(); break; }
      A.armed = null;
      if (key.indexOf("restore:")===0){
        api("/api/restore", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ key:key.slice(8) }) })
          .then(function(r){ S = r.state; DATA.base = S.savedAt; DATA.state = "ok"; normalize(); A.backups = null; A.edit = null; render(); toast("Copia restaurada. Tu web ya muestra esa versión."); })
          .catch(function(){ toast("No se pudo restaurar esa copia. Inténtalo de nuevo."); });
        break;
      }
      if (key==="examples"){
        var exIds = S.products.filter(function(p){return p.example;}).map(function(p){return p.id;});
        S.products = S.products.filter(function(p){return !p.example;});
        S.collections = S.collections.filter(function(c){return !c.example;});
        S.collections.forEach(function(c){ c.productIds = (c.productIds||[]).filter(function(x){return exIds.indexOf(x)<0;}); });
        toast("Ejemplos eliminados.");
      } else if (key.indexOf("p:")===0){
        var pid = key.slice(2); S.products = S.products.filter(function(p){return p.id!==pid;});
        S.collections.forEach(function(c){ c.productIds = (c.productIds||[]).filter(function(x){return x!==pid;}); });
        if (A.back){ A.back.f.productIds = A.back.f.productIds.filter(function(x){return x!==pid;}); A.edit = A.back; A.back = null; } else A.edit = null;
        toast("Producto eliminado.");
      } else if (key.indexOf("c:")===0){
        var cid2 = key.slice(2); S.collections = S.collections.filter(function(c){return c.id!==cid2;}); A.edit = null; toast("Colección eliminada.");
      } else if (key.indexOf("cat:")===0){
        var kid = key.slice(4), gone = cat(kid), up = gone && gone.parent && cat(gone.parent) ? gone.parent : "";
        S.categories = S.categories.filter(function(c){return c.id!==kid;});
        S.categories.forEach(function(c){ if (c.parent===kid) delete c.parent; });
        S.products.forEach(function(p){ if (p.category===kid) p.category=up; });
        S.collections.forEach(function(x){ if (x.category===kid) x.category=up; });
        toast("Categoría eliminada.");
      }
      changed(); render(); break;
    }
  }
});
root.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "s-photo" && t.files && t.files[0]){
    readSettings(); A.uploading = true; render();
    uploadImage(t.files[0], 1400).then(function(url){ S.settings.welcomePhoto = url; changed(); toast("Foto subida."); })
      .catch(function(err){ toast(err.status === 401 ? "Tu sesión expiró. Vuelve a entrar." : "No se pudo subir la foto. Prueba con JPG o PNG."); })
      .then(function(){ A.uploading = false; render(); });
    return;
  }
  if (t.id === "f-img" && t.files && t.files[0]){
    syncForm();
    var wide = A.edit.kind === "c", ed = A.edit;
    A.uploading = true; render();
    uploadImage(t.files[0], wide ? 2000 : 1200).then(function(url){ ed.f.image = url; })
      .catch(function(err){ toast(err.status === 401 ? "Tu sesión expiró. Vuelve a entrar." : "No se pudo subir la foto. Prueba con JPG o PNG."); })
      .then(function(){ A.uploading = false; render(); });
  } else if (t.id === "f-store"){ syncForm(); render(); }
  else if (t.id === "a-qcat"){ A.qcat = t.value; render(); }
  else if (t.hasAttribute && t.hasAttribute("data-cat-parent")){
    var cp = cat(t.getAttribute("data-cat-parent")); if (cp){ if (t.value) cp.parent = t.value; else delete cp.parent; changed(); render(); }
  }
  else if (t.hasAttribute && t.hasAttribute("data-cat-en")){
    var ce = cat(t.getAttribute("data-cat-en")); if (ce){ ce.label_en = t.value.trim(); delete ce.label_en_src; changed(); render(); }
  }
  else if (t.hasAttribute && t.hasAttribute("data-cat")){
    var c = cat(t.getAttribute("data-cat")); if (c && t.value.trim()){ c.label = t.value.trim(); changed(); render(); }
  }
});
root.addEventListener("input", function(e){
  if (e.target.id === "a-q"){ A.q = e.target.value; var pos = e.target.selectionStart; render(); var q = document.getElementById("a-q"); if (q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} } }
});

/* ---------- routing ---------- */
function render(){
  if (!loaded) return;
  if (DATA.state === "error"){
    root.innerHTML = '<main class="wrap"><div class="empty" style="margin-top:60px"><h2>'+(LANG==="en"?"We couldn\'t load the shop":"No se pudo cargar la vitrina")+'</h2><p>'+(LANG==="en"?"Check your connection and try again.":"Revisa tu conexión e inténtalo de nuevo.")+'</p><button class="btn" data-act="reload" type="button">'+(LANG==="en"?"Try again":"Reintentar")+'</button></div></main>';
    return;
  }
  var h = location.hash.slice(1), html;
  if (!h && /^\/admin\/?$/i.test(location.pathname)) h = "admin";
  if (h === "admin") html = viewAdmin();
  else if (h.indexOf("c-")===0) html = viewColl(h.slice(2));
  else if (h.indexOf("cat-")===0) html = viewCat(h.slice(4));
  else html = viewHome();
  root.innerHTML = html;
  paintSave();
  document.title = siteName();
}
window.addEventListener("hashchange", function(){
  A.armed = null; render();
  if (location.hash === "#colecciones"){ var el = document.getElementById("colecciones"); if (el){ el.scrollIntoView({behavior:"smooth"}); return; } }
  window.scrollTo(0,0);
});

var checkLogin = pw ? api("/api/login", { method: "POST" }).then(function(){ canEdit = true; }).catch(function(){ forget(); pw = ""; }) : Promise.resolve();
Promise.all([load(), checkLogin]).then(function(){ loaded = true; render(); if (canEdit) setTimeout(autoTranslate, 1200); });
})();
</script>
